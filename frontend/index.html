<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mailer UI</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; }
    .card { background: white; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input { display: block; width: 100%; padding: 8px; margin: 10px 0; }
    button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Send Assignment Email</h2>
    <input id="assignEmail" type="email" placeholder="User Email" />
    <input id="assignProject" type="text" placeholder="Project Title" />
    <button onclick="sendAssignment()">Send Assignment</button>
    <p id="assignResponse"></p>
  </div>

  <div class="card">
    <h2>Notify Admin on Completion</h2>
    <input id="adminEmail" type="email" placeholder="Admin Email" />
    <input id="completionProject" type="text" placeholder="Project Title" />
    <input id="userId" type="text" placeholder="User ID" />
    <button onclick="notifyAdmin()">Notify Admin</button>
    <p id="completeResponse"></p>
  </div>

  <script>
    async function sendAssignment() {
      const email = document.getElementById('assignEmail').value;
      const project = document.getElementById('assignProject').value;

      const res = await fetch('/mailer/send-assignment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, project }),
      });
      const data = await res.json();
      document.getElementById('assignResponse').textContent = data.message || 'Done';
    }

    async function notifyAdmin() {
      const adminEmail = document.getElementById('adminEmail').value;
      const project = document.getElementById('completionProject').value;
      const userId = document.getElementById('userId').value;

      const res = await fetch('/mailer/notify-completion', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminEmail, project, userId }),
      });
      const data = await res.json();
      document.getElementById('completeResponse').textContent = data.message || 'Done';
    }
  </script>
</body>
</html>
